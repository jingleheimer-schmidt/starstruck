
[mod-setting-name]
starstruck-hide-factorio-logo=Hide Factorio Logos technology
starstruck-hide-manual-color-module=Hide Manual Color Module recipe

[mod-setting-description]

starstruck-hide-factorio-logo=By default, the [color=blue]Rainbow Menu Logos[/color] mod adds: \n[technology=factorio-logo] [color=green][Technology: Factorio Logos][/color] \n ├[recipe=factorio-logo-item-11tiles] [color=green][Recipe: Factorio logo 11 tiles][/color] \n ├[recipe=factorio-logo-item-16tiles] [color=green][Recipe: Factorio logo 16 tiles][/color] \n ├[recipe=factorio-logo-item-22tiles] [color=green][Recipe: Factorio logo 22 tiles][/color] \nEnable this setting to hide the technology.

starstruck-hide-manual-color-module=By default, the [color=blue]Automatic Train Painter[/color] mod adds: \n[recipe=manual-color-module] [color=green][Recipe: Manual Color Module][/color] \nEnable this setting to hide the recipe.
